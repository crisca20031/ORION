<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Jarvis HUD</title>
<style>
  :root { --accent: #ff5c33; --bg: #0b0b0d; --fg: #d8d8d8; --dim: #6b6b6b; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    overflow: hidden;
  }
  body { padding: 3vh 4vw; display: flex; flex-direction: column; gap: 3vh; }
  h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0.15em; color: var(--dim); font-weight: 400; }
  h1 span { color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 4vw; flex: 1; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 1.2vh; min-height: 0; }
  .label { color: var(--accent); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1vh; overflow: hidden; }
  li { font-size: 1rem; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.done { color: var(--dim); text-decoration: line-through; }
  .empty { color: var(--dim); }
  footer { color: var(--dim); font-size: 0.75rem; }
</style>
</head>
<body>
  <h1>JARVIS <span>OS</span> — <span id="fecha"></span></h1>
  <div class="grid">
    <div class="col">
      <div class="label">Prioridades de hoy</div>
      <ul id="plan"><li class="empty">—</li></ul>
    </div>
    <div class="col">
      <div class="label">Números de la semana</div>
      <ul id="metricas"><li class="empty">—</li></ul>
    </div>
    <div class="col">
      <div class="label">Últimas 5 notas</div>
      <ul id="ultimas"><li class="empty">—</li></ul>
    </div>
  </div>
  <footer>lee vault/ · sin datos inventados · actualiza cada 60s</footer>

<script>
const VAULT = "../vault/";

function hoyISO() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

async function fetchText(path) {
  try {
    const res = await fetch(path, { cache: "no-store" });
    if (!res.ok) return null;
    return await res.text();
  } catch { return null; }
}

function renderList(elId, items) {
  const el = document.getElementById(elId);
  el.innerHTML = "";
  if (!items || items.length === 0) {
    el.innerHTML = '<li class="empty">—</li>';
    return;
  }
  for (const it of items) {
    const li = document.createElement("li");
    li.textContent = it.text;
    if (it.done) li.className = "done";
    el.appendChild(li);
  }
}

function parsePlan(md) {
  if (!md) return [];
  return md
    .split("\n")
    .filter(l => /^[-*]\s*\[[ xX]\]/.test(l.trim()))
    .map(l => {
      const done = /\[[xX]\]/.test(l);
      const text = l.replace(/^[-*]\s*\[[ xX]\]\s*/, "").trim();
      return { text, done };
    });
}

function parseMetricas(md) {
  if (!md) return [];
  return md
    .split("\n")
    .filter(l => l.trim().startsWith("-"))
    .map(l => ({ text: l.replace(/^-\s*/, "").trim() }));
}

async function cargar() {
  document.getElementById("fecha").textContent = hoyISO();

  const plan = await fetchText(`${VAULT}plan/${hoyISO()}.md`);
  renderList("plan", parsePlan(plan));

  const metricas = await fetchText(`${VAULT}salidas/${hoyISO()}-metricas.md`);
  renderList("metricas", parseMetricas(metricas));

  // Últimas 5 notas: requiere un índice, porque el navegador no puede
  // listar directorios solo. Lo genera hud/server.py (ver README).
  const indice = await fetchText(`${VAULT}../hud/ultimas.json`);
  if (indice) {
    try {
      const items = JSON.parse(indice).map(n => ({ text: n }));
      renderList("ultimas", items);
    } catch { renderList("ultimas", []); }
  } else {
    renderList("ultimas", []);
  }
}

cargar();
setInterval(cargar, 60000);
</script>
</body>
</html>
